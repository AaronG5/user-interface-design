<!doctype html>
<html lang="lt">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Anketos forma</title>
      <link rel="stylesheet" href="index.css" />
      <script src="main.js" defer></script>
   </head>

   <body>
      <form id="personal-data-form" action="#" method="post" enctype="multipart/form-data"></form>

      <fieldset>
         <legend>Lytis</legend>
         <label class="option-label">
            <input class="option-input" type="radio" name="lytis" value="vyras" required />
            Vyras
         </label>
         <label class="option-label">
            <input class="option-input" type="radio" name="lytis" value="moteris" required />
            Moteris
         </label>
      </fieldset>

      <fieldset>
         <legend>Vardas / Pavardė</legend>
         <label for="vardas">Vardas</label>
         <input id="vardas" name="vardas" type="text" required />

         <label for="antras_vardas">Antrasis vardas</label>
         <input id="antras_vardas" name="antras_vardas" type="text" />

         <label for="pavarde">Pavardė</label>
         <input id="pavarde" name="pavarde" type="text" required />
      </fieldset>

      <fieldset>
         <legend>Gimimo duomenys</legend>
         <label for="gimimo_data">Gimimo data</label>
         <input
            id="gimimo_data"
            name="gimimo_data"
            type="text"
            placeholder="yyyy/mm/dd"
            pattern="^[0-9]{4}/[0-9]{2}/[0-9]{2}$"
            title="Įveskite datą formatu yyyy/mm/dd"
            required
         />
         <label for="asmens_kodas">Asmens kodas</label>
         <input id="asmens_kodas" name="asmens_kodas" type="text" required />
      </fieldset>

      <fieldset>
         <legend>Išsilavinimas</legend>
         <label for="issilavinimas">Išsilavinimo lygis</label>
         <select id="issilavinimas" name="issilavinimas" required>
            <option value="" disabled selected>Pasirinkite...</option>
            <option value="pagrindinis">Pagrindinis</option>
            <option value="vidurinis">Vidurinis</option>
            <option value="profesinis">Profesinis</option>
            <option value="aukstasis_kolegijinis">Aukštasis - kolegijinis</option>
            <option value="aukstasis_universitetinis">Aukštasis - universitetinis</option>
         </select>

         <div class="subgroup">
            <label for="paskutine_istaiga">Paskutinė baigta mokslo / studijų įstaiga</label>
            <input id="paskutine_istaiga" name="paskutine_istaiga" type="text" />

            <label for="baigimo_metai">Baigimo metai</label>
            <input id="baigimo_metai" name="baigimo_metai" type="number" min="1900" max="2050" />

            <!-- Shown when the level gives a qualification -->
            <div id="kvalifikacija_group" hidden>
               <label for="kvalifikacija">Kvalifikacija (specialybės pavadinimas)</label>
               <input id="kvalifikacija" name="kvalifikacija" type="text" disabled />
            </div>

            <!-- Shown and filled when the level gives a degree -->
            <div id="mokslo_laipsnis_group" hidden>
               <label for="mokslo_laipsnis">Mokslo laipsnis</label>
               <select id="mokslo_laipsnis" name="mokslo_laipsnis" required disabled>
                  <option value="" disabled selected>Pasirinkite...</option>
               </select>
            </div>
         </div>
      </fieldset>

      <fieldset>
         <legend>Kontaktiniai duomenys</legend>
         <label for="telefonas">Telefono numeris</label>
         <input id="telefonas" name="telefonas" type="tel" placeholder="+370xxxxxxxx" required />

         <label for="el_pastas">El. pašto adresas</label>
         <input id="el_pastas" name="el_pastas" type="email" required />

         <label for="adresas">Gyvenamoji vieta (adresas)</label>
         <input id="adresas" name="adresas" type="text" required />
      </fieldset>

      <!-- Shown only when the person is 18 or older -->
      <fieldset id="vedybine_fieldset" hidden disabled>
         <legend>Vedybinė padėtis</legend>
         <label for="vedybine">Vedybinė padėtis</label>
         <select id="vedybine" name="vedybine">
            <option value="" selected>Pasirinkite...</option>
            <option value="nevedes">Nevedęs / Netekėjusi</option>
            <option value="vedes">Vedęs / Ištekėjusi</option>
            <option value="issiskyres">Išsiskyręs(-usi)</option>
         </select>

         <!-- Shown only when "Vedęs / Ištekėjusi" is selected -->
         <div class="subgroup" id="sutuoktinis_group" hidden>
            <label for="sutuoktinis_vardas">Sutuoktinis(-ė) vardas</label>
            <input id="sutuoktinis_vardas" name="sutuoktinis_vardas" type="text" disabled />

            <label for="sutuoktinis_pavarde">Sutuoktinis(-ė) pavardė</label>
            <input id="sutuoktinis_pavarde" name="sutuoktinis_pavarde" type="text" disabled />
         </div>
      </fieldset>

      <fieldset>
         <legend>Profesinė padėtis</legend>
         <label for="prof_padetis">Profesinė padėtis</label>
         <select id="prof_padetis" name="prof_padetis" required>
            <option value="" disabled selected>Pasirinkite...</option>
            <option value="studijuoja">Studijuoja</option>
            <option value="dirba">Dirba</option>
            <option value="nedirba">Nedirba</option>
            <option value="atostogos">Motinystės / tėvystės atostogose</option>
         </select>

         <!-- Each group is shown only when its data-shown-for option is selected -->
         <div class="subgroup" id="studijuoja_group" data-shown-for="studijuoja" hidden>
            <label for="stud_pakopa">Studijų pakopa</label>
            <input id="stud_pakopa" name="stud_pakopa" type="text" />

            <label for="stud_kursas">Kursas</label>
            <input id="stud_kursas" name="stud_kursas" type="text" />

            <label for="stud_istaiga">Įstaiga</label>
            <input id="stud_istaiga" name="stud_istaiga" type="text" />

            <label for="tiketini_baigimo_metai">Tikėtini baigimo metai</label>
            <input
               id="tiketini_baigimo_metai"
               name="tiketini_baigimo_metai"
               type="number"
               min="1900"
               max="2100"
            />
         </div>

         <div class="subgroup" id="dirba_group" data-shown-for="dirba" hidden>
            <label for="darbo_istaiga">Darbo įstaiga</label>
            <input id="darbo_istaiga" name="darbo_istaiga" type="text" />

            <label for="pareigos">Pareigos</label>
            <input id="pareigos" name="pareigos" type="text" />
         </div>

         <div class="subgroup" id="nedirba_group" data-shown-for="nedirba" hidden>
            <label for="nedarbo_priezastis">Nedarbo priežastis</label>
            <input id="nedarbo_priezastis" name="nedarbo_priezastis" type="text" />
         </div>

         <div class="subgroup" id="atostogos_group" data-shown-for="atostogos" hidden>
            <label for="atostogu_pabaiga">Atostogų pabaiga</label>
            <input
               id="atostogu_pabaiga"
               name="atostogu_pabaiga"
               type="text"
               placeholder="yyyy/mm/dd"
               pattern="^[0-9]{4}/[0-9]{2}/[0-9]{2}$"
               title="Įveskite datą formatu yyyy/mm/dd"
            />
         </div>
      </fieldset>

      <fieldset>
         <legend>Darbo patirtis</legend>
         <label class="option-label">
            <input
               class="option-input"
               type="radio"
               name="turi_darbo_patirties"
               value="taip"
               required
            />
            <span class="dot"></span>
            Turiu darbo patirties
         </label>
         <label class="option-label">
            <input class="option-input" type="radio" name="turi_darbo_patirties" value="ne" />
            <span class="dot"></span>
            Neturiu darbo patirties
         </label>

         <!-- Shown only when "Turiu darbo patirties" is selected -->
         <div class="subgroup" id="darbo_patirtis_group" hidden>
            <label for="darbo_patirtis">Darbo patirtis (metai)</label>
            <input id="darbo_patirtis" name="darbo_patirtis" type="number" min="0" />

            <label for="darbo_sritis">Darbo sritis</label>
            <select id="darbo_sritis" name="darbo_sritis">
               <option value="" selected>Pasirinkite...</option>
               <option value="teise">Teisė</option>
               <option value="viesasis_sektorius">Viešasis sektorius</option>
               <option value="sveikatos_apsauga">Sveikatos apsauga</option>
               <option value="farmacija">Farmacija</option>
               <option value="pramone">Pramonė / gamyba</option>
               <option value="it">IT</option>
               <option value="prekyba">Prekyba</option>
               <option value="krasto_apsauga">Krašto apsauga</option>
               <option value="vidaus_reikalai">Vidaus reikalų sistema</option>
               <option value="klientu_aptarnavimas">Klientų aptarnavimas ir paslaugos</option>
               <option value="transportas">Transportas</option>
               <option value="kultura_pramogos">Kultūra ir pramogos</option>
               <option value="svietimas_studijos">Švietimas / studijos</option>
            </select>
         </div>
      </fieldset>
   </body>
</html>
