<!doctype html>
<html lang="lt">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Anketos forma</title>
      <link rel="stylesheet" href="index.css" />
      <script src="main.js" defer></script>
   </head>

   <body>
      <form id="personal-data-form" action="#" method="post" enctype="multipart/form-data"></form>

      <fieldset>
         <legend>Lytis</legend>
         <label class="option-label">
            <input class="option-input" type="radio" name="lytis" value="vyras" required />
            Vyras
         </label>
         <label class="option-label">
            <input class="option-input" type="radio" name="lytis" value="moteris" required />
            Moteris
         </label>
      </fieldset>

      <fieldset>
         <legend>Vardas / Pavardė</legend>
         <label for="vardas">Vardas</label>
         <input id="vardas" name="vardas" type="text" required />

         <label for="antras_vardas">Antrasis vardas</label>
         <input id="antras_vardas" name="antras_vardas" type="text" />

         <label for="pavarde">Pavardė</label>
         <input id="pavarde" name="pavarde" type="text" required />
      </fieldset>

      <fieldset>
         <legend>Gimimo duomenys</legend>
         <label for="gimimo_data">Gimimo data</label>
         <input
            id="gimimo_data"
            name="gimimo_data"
            type="text"
            placeholder="yyyy/mm/dd"
            pattern="^[0-9]{4}/[0-9]{2}/[0-9]{2}$"
            title="Įveskite datą formatu yyyy/mm/dd"
            required
         />
         <label for="asmens_kodas">Asmens kodas</label>
         <input id="asmens_kodas" name="asmens_kodas" type="text" required />
      </fieldset>

      <fieldset>
         <legend>Išsilavinimas</legend>
         <label for="issilavinimas">Išsilavinimo lygis</label>
         <select id="issilavinimas" name="issilavinimas" required>
            <option value="" disabled selected>Pasirinkite...</option>
            <option value="pagrindinis">Pagrindinis</option>
            <option value="vidurinis">Vidurinis</option>
            <option value="profesinis">Profesinis</option>
            <option value="aukstasis_kolegijinis">Aukštasis - kolegijinis</option>
            <option value="aukstasis_universitetinis">Aukštasis - universitetinis</option>
         </select>

         <div class="subgroup">
            <label for="paskutine_istaiga">Paskutinė baigta mokslo / studijų įstaiga</label>
            <input id="paskutine_istaiga" name="paskutine_istaiga" type="text" />

            <label for="baigimo_metai">Baigimo metai</label>
            <input id="baigimo_metai" name="baigimo_metai" type="number" min="1900" max="2050" />

            <!-- Shown when the level gives a qualification -->
            <div id="kvalifikacija_group" hidden>
               <label for="kvalifikacija">Kvalifikacija (specialybės pavadinimas)</label>
               <input id="kvalifikacija" name="kvalifikacija" type="text" disabled />
            </div>

            <!-- Shown and filled when the level gives a degree -->
            <div id="mokslo_laipsnis_group" hidden>
               <label for="mokslo_laipsnis">Mokslo laipsnis</label>
               <select id="mokslo_laipsnis" name="mokslo_laipsnis" required disabled>
                  <option value="" disabled selected>Pasirinkite...</option>
               </select>
            </div>
         </div>
      </fieldset>

      <fieldset>
         <legend>Kontaktiniai duomenys</legend>
         <label for="telefonas">Telefono numeris</label>
         <input id="telefonas" name="telefonas" type="tel" placeholder="+370xxxxxxxx" required />

         <label for="el_pastas">El. pašto adresas</label>
         <input id="el_pastas" name="el_pastas" type="email" required />

         <label for="adresas">Gyvenamoji vieta (adresas)</label>
         <input id="adresas" name="adresas" type="text" required />
      </fieldset>
   </body>
</html>
